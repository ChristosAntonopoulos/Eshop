openapi: 3.0.3
info:
  title: LCG Shop API
  description: |
    REST API contract consumed by the LCG Shop React frontend when mock flags
    are set to `false`. Paths are relative to `VITE_API_BASE_URL`
    (default `http://localhost:8080/api`).

    Flags:
    - `VITE_USE_MOCK_DATA=false` — products + categories (storefront + admin CRUD)
    - `VITE_USE_MOCK_AUTH=false` — auth + admin customers
    - `VITE_USE_MOCK_ORDERS=false` — checkout create + admin orders

    Source of truth for frontend usage:
    - `src/services/products/httpProductRepository.ts`
    - `src/services/categories/httpCategoryRepository.ts`
    - `src/services/orders/httpOrderRepository.ts`
    - `src/services/admin/httpAdminCustomerRepository.ts`
    - `src/services/auth/httpAuthRepository.ts`
  version: 1.1.0
  contact:
    name: LCG Shop Frontend Team

servers:
  - url: http://localhost:8080/api
    description: Local development (matches `.env` `VITE_API_BASE_URL`)

tags:
  - name: Products
    description: Catalog listing, detail, featured, related, and admin CRUD
  - name: Categories
    description: Category navigation and admin CRUD
  - name: Orders
    description: Checkout create order and admin order management
  - name: Admin
    description: Admin-only customer listing (requires ROLE_ADMIN / Bearer JWT)

paths:
  /products:
    get:
      tags: [Products]
      operationId: getProducts
      summary: List products with optional filters
      description: |
        Returns products. By default only active products. Pass `includeInactive=true`
        for the admin catalog. Supports text search, category filter, price range,
        stock filter, and sort order.
      parameters:
        - $ref: "#/components/parameters/search"
        - $ref: "#/components/parameters/categoryId"
        - $ref: "#/components/parameters/minPrice"
        - $ref: "#/components/parameters/maxPrice"
        - $ref: "#/components/parameters/sortBy"
        - $ref: "#/components/parameters/onlyInStock"
        - $ref: "#/components/parameters/includeInactive"
      responses:
        "200":
          description: Matching products (may be empty array)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
              examples:
                filteredList:
                  summary: Supplements sorted by price ascending
                  value:
                    - id: "1"
                      slug: whey-protein-chocolate-1kg
                      name: Whey Protein Chocolate 1kg
                      shortDescription: High-quality whey protein for muscle recovery.
                      description: A smooth chocolate whey protein powder designed for daily use after training or as a protein boost during the day.
                      categoryId: supplements
                      brand: FitCore
                      price: 34.9
                      compareAtPrice: 39.9
                      imageUrl: https://picsum.photos/seed/whey-chocolate/600/600
                      gallery:
                        - https://picsum.photos/seed/whey-chocolate/600/600
                        - https://picsum.photos/seed/whey-chocolate-2/600/600
                      stockQuantity: 12
                      isActive: true
                      isFeatured: true
                      isNew: true
                      tags: [protein, whey, recovery, gym]
                      nutritionalInfo:
                        protein: 24g
                        carbs: 3g
                        calories: 120 kcal
                        servingSize: 30g
                      createdAt: "2026-05-01T10:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Products]
      operationId: createProduct
      summary: Create product (admin)
      description: Requires Bearer JWT with ROLE_ADMIN. Used when `VITE_USE_MOCK_DATA=false`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductWriteInput"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — admin role required

  /products/featured:
    get:
      tags: [Products]
      operationId: getFeaturedProducts
      summary: List featured products
      description: |
        Products with `isFeatured: true`, typically shown on the home page.
        Register this route **before** `/products/{slug}` in ASP.NET routing.
      responses:
        "200":
          description: Featured products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
              examples:
                featured:
                  value:
                    - id: "1"
                      slug: whey-protein-chocolate-1kg
                      name: Whey Protein Chocolate 1kg
                      shortDescription: High-quality whey protein for muscle recovery.
                      description: A smooth chocolate whey protein powder designed for daily use after training or as a protein boost during the day.
                      categoryId: supplements
                      brand: FitCore
                      price: 34.9
                      compareAtPrice: 39.9
                      imageUrl: https://picsum.photos/seed/whey-chocolate/600/600
                      gallery:
                        - https://picsum.photos/seed/whey-chocolate/600/600
                      stockQuantity: 12
                      isActive: true
                      isFeatured: true
                      isNew: true
                      tags: [protein, whey, recovery, gym]
                      nutritionalInfo:
                        protein: 24g
                        carbs: 3g
                        calories: 120 kcal
                        servingSize: 30g
                      createdAt: "2026-05-01T10:00:00Z"
                    - id: "2"
                      slug: electrolytes-lemon
                      name: Electrolytes Lemon
                      shortDescription: Hydration support for long training sessions.
                      description: Electrolyte formula with a fresh lemon taste, ideal for workouts, swimming, running and hot days.
                      categoryId: hydration
                      brand: HydroFuel
                      price: 14.5
                      imageUrl: https://picsum.photos/seed/electrolytes-lemon/600/600
                      gallery:
                        - https://picsum.photos/seed/electrolytes-lemon/600/600
                      stockQuantity: 20
                      isActive: true
                      isFeatured: true
                      isNew: false
                      tags: [electrolytes, hydration, training]
                      createdAt: "2026-04-20T10:00:00Z"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /products/{slug}:
    get:
      tags: [Products]
      operationId: getProductBySlug
      summary: Get product by URL slug
      description: |
        Returns a single product or JSON `null` when not found (frontend types this as `Product | null`).
        Alternatively, the backend may return **404** with no body; the frontend currently only checks `response.ok`.
      parameters:
        - name: slug
          in: path
          required: true
          description: URL-friendly product identifier (e.g. `whey-protein-chocolate-1kg`)
          schema:
            type: string
          example: whey-protein-chocolate-1kg
      responses:
        "200":
          description: Product found, or `null` if not found (if using null body pattern)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Product"
                  - type: "null"
              examples:
                found:
                  value:
                    id: "1"
                    slug: whey-protein-chocolate-1kg
                    name: Whey Protein Chocolate 1kg
                    shortDescription: High-quality whey protein for muscle recovery.
                    description: A smooth chocolate whey protein powder designed for daily use after training or as a protein boost during the day.
                    categoryId: supplements
                    brand: FitCore
                    price: 34.9
                    compareAtPrice: 39.9
                    imageUrl: https://picsum.photos/seed/whey-chocolate/600/600
                    gallery:
                      - https://picsum.photos/seed/whey-chocolate/600/600
                      - https://picsum.photos/seed/whey-chocolate-2/600/600
                    stockQuantity: 12
                    isActive: true
                    isFeatured: true
                    isNew: true
                    tags: [protein, whey, recovery, gym]
                    nutritionalInfo:
                      protein: 24g
                      carbs: 3g
                      calories: 120 kcal
                      servingSize: 30g
                    createdAt: "2026-05-01T10:00:00Z"
                notFoundNull:
                  summary: Not found (null body — matches mock repository)
                  value: null
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /products/{id}/related:
    get:
      tags: [Products]
      operationId: getRelatedProducts
      summary: Related products for a product
      description: |
        Returns products related to the given **product id** (not slug).
        Used on the product detail page carousel.
      parameters:
        - name: id
          in: path
          required: true
          description: Product id (e.g. `1`)
          schema:
            type: string
          example: "1"
      responses:
        "200":
          description: Related products (empty array if none)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
              examples:
                related:
                  value:
                    - id: "3"
                      slug: protein-cookie-chocolate-chip
                      name: Protein Cookie Chocolate Chip
                      shortDescription: Soft protein cookie with chocolate chips.
                      description: A convenient protein snack for before or after training.
                      categoryId: protein-snacks
                      brand: SnackFit
                      price: 2.8
                      imageUrl: https://picsum.photos/seed/protein-cookie/600/600
                      gallery:
                        - https://picsum.photos/seed/protein-cookie/600/600
                      stockQuantity: 50
                      isActive: true
                      isFeatured: false
                      isNew: true
                      tags: [cookie, protein snack, chocolate]
                      nutritionalInfo:
                        protein: 18g
                        carbs: 22g
                        calories: 240 kcal
                        servingSize: 1 cookie
                      createdAt: "2026-05-15T10:00:00Z"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /products/by-id/{id}:
    get:
      tags: [Products]
      operationId: getProductById
      summary: Get product by id (admin)
      description: Used by admin edit form. Prefer registering before slug routes if needed.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product or null
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Product"
                  - type: "null"
        "404":
          $ref: "#/components/responses/NotFound"

  /products/{id}:
    put:
      tags: [Products]
      operationId: updateProduct
      summary: Update product (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductWriteInput"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/NotFound"

  /products/{id}/active:
    patch:
      tags: [Products]
      operationId: setProductActive
      summary: Activate or deactivate product (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isActive]
              properties:
                isActive:
                  type: boolean
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /categories:
    get:
      tags: [Categories]
      operationId: getCategories
      summary: List all categories
      description: |
        Active categories for navigation by default. Pass `includeInactive=true` for admin.
      parameters:
        - $ref: "#/components/parameters/includeInactive"
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Categories]
      operationId: createCategory
      summary: Create category (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryWriteInput"
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"

  /categories/by-id/{id}:
    get:
      tags: [Categories]
      operationId: getCategoryById
      summary: Get category by id (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Category or null
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Category"
                  - type: "null"

  /categories/{id}:
    put:
      tags: [Categories]
      operationId: updateCategory
      summary: Update category (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryWriteInput"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          $ref: "#/components/responses/NotFound"

  /categories/{id}/active:
    patch:
      tags: [Categories]
      operationId: setCategoryActive
      summary: Activate or deactivate category (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isActive]
              properties:
                isActive:
                  type: boolean
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /categories/{slug}:
    get:
      tags: [Categories]
      operationId: getCategoryBySlug
      summary: Get category by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
          example: supplements
      responses:
        "200":
          description: Category or null
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Category"
                  - type: "null"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /orders:
    get:
      tags: [Orders]
      operationId: listOrders
      summary: List orders (admin)
      description: Requires ROLE_ADMIN. Used when `VITE_USE_MOCK_ORDERS=false`.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/OrderStatus"
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      tags: [Orders]
      operationId: createOrder
      summary: Create order (checkout)
      description: |
        Called from `CheckoutPage` via `orderRepository.create`.
        Flat shipping rate in the frontend mock is `3.5` EUR when subtotal > 0.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "200":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /orders/{id}:
    get:
      tags: [Orders]
      operationId: getOrderById
      summary: Get order by id (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order or null
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Order"
                  - type: "null"
        "404":
          $ref: "#/components/responses/NotFound"

  /orders/{id}/status:
    patch:
      tags: [Orders]
      operationId: updateOrderStatus
      summary: Update order status (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: "#/components/schemas/OrderStatus"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/customers:
    get:
      tags: [Admin]
      operationId: listCustomers
      summary: List customers (admin)
      description: Requires ROLE_ADMIN. Used when `VITE_USE_MOCK_AUTH=false`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Users without passwords
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuthUser"

  /admin/customers/{id}:
    get:
      tags: [Admin]
      operationId: getCustomer
      summary: Get customer by id (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User or null
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthUser"
                  - type: "null"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    search:
      name: search
      in: query
      description: Case-insensitive match on name, description, tags
      schema:
        type: string
      example: whey
    categoryId:
      name: categoryId
      in: query
      description: Filter by category id (same as `Category.id`, e.g. `supplements`)
      schema:
        type: string
      example: supplements
    minPrice:
      name: minPrice
      in: query
      description: Minimum price (inclusive)
      schema:
        type: number
        format: double
      example: 10
    maxPrice:
      name: maxPrice
      in: query
      description: Maximum price (inclusive)
      schema:
        type: number
        format: double
      example: 50
    sortBy:
      name: sortBy
      in: query
      description: Sort order for results
      schema:
        $ref: "#/components/schemas/ProductSortBy"
      example: price-asc
    onlyInStock:
      name: onlyInStock
      in: query
      description: When true, exclude products with `stockQuantity === 0`
      schema:
        type: boolean
      example: true
    includeInactive:
      name: includeInactive
      in: query
      description: When true, include inactive products/categories (admin)
      schema:
        type: boolean
      example: true

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ProductSortBy:
      type: string
      enum: [newest, price-asc, price-desc, name]
      description: Mirrors `ProductQueryParams.sortBy` in `productRepository.ts`

    ProductNutritionalInfo:
      type: object
      description: Optional nutrition label fields (display strings)
      properties:
        protein:
          type: string
          example: 24g
        carbs:
          type: string
          example: 3g
        calories:
          type: string
          example: 120 kcal
        servingSize:
          type: string
          example: 30g

    Product:
      type: object
      required:
        - id
        - slug
        - name
        - description
        - shortDescription
        - categoryId
        - price
        - imageUrl
        - gallery
        - stockQuantity
        - isActive
        - isFeatured
        - isNew
        - tags
        - createdAt
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        shortDescription:
          type: string
        categoryId:
          type: string
          description: References `Category.id` (e.g. supplements, hydration)
        brand:
          type: string
        price:
          type: number
          format: double
        compareAtPrice:
          type: number
          format: double
        imageUrl:
          type: string
          format: uri
        gallery:
          type: array
          items:
            type: string
            format: uri
        stockQuantity:
          type: integer
          minimum: 0
        isActive:
          type: boolean
        isFeatured:
          type: boolean
        isNew:
          type: boolean
        tags:
          type: array
          items:
            type: string
        nutritionalInfo:
          $ref: "#/components/schemas/ProductNutritionalInfo"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          description: Domain field; optional in responses until frontend types include it

    Category:
      type: object
      required:
        - id
        - slug
        - name
        - description
        - isActive
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        imageUrl:
          type: string
          format: uri
        isActive:
          type: boolean

    ProductQueryParams:
      type: object
      description: Query string shape for GET /products (all fields optional)
      properties:
        search:
          type: string
        categoryId:
          type: string
        minPrice:
          type: number
        maxPrice:
          type: number
        sortBy:
          $ref: "#/components/schemas/ProductSortBy"
        onlyInStock:
          type: boolean

    OrderCustomer:
      type: object
      required: [firstName, lastName, email, phone]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string

    OrderShippingAddress:
      type: object
      required: [address, city, postalCode]
      properties:
        address:
          type: string
        city:
          type: string
        postalCode:
          type: string

    OrderLineItem:
      type: object
      required: [productId, quantity, unitPrice]
      properties:
        productId:
          type: string
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          type: number
          format: double
          description: Price per unit at time of order (from cart)

    CreateOrderRequest:
      type: object
      required: [customer, shippingAddress, items]
      properties:
        customer:
          $ref: "#/components/schemas/OrderCustomer"
        shippingAddress:
          $ref: "#/components/schemas/OrderShippingAddress"
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderLineItem"
        notes:
          type: string
          description: Optional delivery instructions

    OrderStatus:
      type: string
      enum: [PENDING, CONFIRMED, SHIPPED, DELIVERED, CANCELLED]
      description: Matches `OrderStatus` in `src/features/orders/types/order.types.ts`

    OrderItem:
      type: object
      required: [productId, productName, quantity, unitPrice]
      properties:
        productId:
          type: string
        productName:
          type: string
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          type: number
          format: double

    Order:
      type: object
      description: Full order DTO used by checkout response and admin order pages
      required:
        [
          id,
          status,
          customer,
          shippingAddress,
          items,
          subtotal,
          shipping,
          total,
          createdAt,
        ]
      properties:
        id:
          type: string
        status:
          $ref: "#/components/schemas/OrderStatus"
        customer:
          $ref: "#/components/schemas/OrderCustomer"
        shippingAddress:
          $ref: "#/components/schemas/OrderShippingAddress"
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        notes:
          type: string
        subtotal:
          type: number
          format: double
        shipping:
          type: number
          format: double
        total:
          type: number
          format: double
        createdAt:
          type: string
          format: date-time

    ProductWriteInput:
      type: object
      description: Admin create/update body (slug optional — server may generate)
      required:
        [
          name,
          description,
          shortDescription,
          categoryId,
          price,
          imageUrl,
          gallery,
          stockQuantity,
          isActive,
          isFeatured,
          isNew,
          tags,
        ]
      properties:
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        shortDescription:
          type: string
        categoryId:
          type: string
        brand:
          type: string
        price:
          type: number
        compareAtPrice:
          type: number
        imageUrl:
          type: string
        gallery:
          type: array
          items:
            type: string
        stockQuantity:
          type: integer
        isActive:
          type: boolean
        isFeatured:
          type: boolean
        isNew:
          type: boolean
        tags:
          type: array
          items:
            type: string
        nutritionalInfo:
          $ref: "#/components/schemas/ProductNutritionalInfo"

    CategoryWriteInput:
      type: object
      required: [name, description, isActive]
      properties:
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        imageUrl:
          type: string
        isActive:
          type: boolean

    AuthUser:
      type: object
      required: [id, firstName, lastName, email, role, createdAt]
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        role:
          type: string
          enum: [CUSTOMER, ADMIN]
        defaultAddress:
          type: object
          properties:
            street:
              type: string
            city:
              type: string
            postalCode:
              type: string
            country:
              type: string
        createdAt:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
        code:
          type: string
        details:
          type: object
          additionalProperties: true

  responses:
    BadRequest:
      description: Invalid query parameters or request body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            message: Invalid sortBy value. Allowed values are newest, price-asc, price-desc, name.
            code: VALIDATION_ERROR
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            message: Product not found
            code: NOT_FOUND
    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            message: An unexpected error occurred
            code: INTERNAL_ERROR
